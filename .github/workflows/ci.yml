name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # No DATABASE_URL or ANTHROPIC_API_KEY on purpose: the build must not need them.
      # `npm run eval` is deliberately absent: it calls the paid API.
      - run: npm run build
